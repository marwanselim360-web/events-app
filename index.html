<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      /* الثيم الذهبي الافتراضي */
      --bg-base: #090a0f;
      --bg-radial: radial-gradient(circle at 50% 0%, #1c1917 0%, #0c0a09 100%);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa7c11 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(212, 175, 55, 0.25);
      --text: #f8fafc;
      --text-muted: #a1a1aa;
    }

    /* ثيم Olive & White المخصص */
    body.theme-olive {
      --bg-base: #1c231a;
      --bg-radial: radial-gradient(circle at 50% 0%, #2e382b 0%, #171d15 100%);
      --gold-primary: #879b76;
      --gold-gradient: linear-gradient(135deg, #a3b892 0%, #70825f 50%, #526045 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(163, 184, 146, 0.3);
      --text: #fdfdfd;
      --text-muted: #c2cdba;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-radial);
      background-color: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .wedding-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .monogram {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: var(--gold-primary);
      margin-bottom: 4px;
    }

    .wedding-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .wedding-subtitle {
      color: var(--text-muted);
      font-size: 13px;
    }

    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
      backdrop-filter: blur(8px);
    }

    .custom-upload-btn {
      background: var(--gold-gradient);
      color: #0b0c10;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 30px;
      display: inline-block;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .custom-upload-btn:active {
      transform: scale(0.96);
    }

    #fileInput {
      display: none;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      color: var(--gold-primary);
      display: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .media-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1;
      background: #111;
      border: 1px solid var(--card-border);
    }

    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="wedding-header">
      <div class="monogram" id="displayMonogram">✨</div>
      <h1 class="wedding-title" id="displayTitle">Live Event Album</h1>
      <p class="wedding-subtitle">Share your live moments with us</p>
    </div>

    <div class="upload-card">
      <label for="fileInput" class="custom-upload-btn">📸 Add Photos & Videos</label>
      <input type="file" id="fileInput" multiple accept="image/*,video/*">
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <script>
    // بيانات تيليجرام
    const TELEGRAM_BOT_TOKEN = "8921464117:AAE-EDpZ09tXc0hiCInYr3bN9s8ZLkr8p_w";
    const TELEGRAM_CHAT_ID = "-1004372146565";

    // قراءة باراميترات الرابط تلقائياً
    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('event') || 'Our Wedding';
    const themeName = urlParams.get('theme');

    // تطبيق الثيم
    if (themeName === 'olive') {
      document.body.classList.add('theme-olive');
    }

    // عرض اسم الإيفنت
    const formattedTitle = eventName.replace(/_/g, ' ');
    document.getElementById('displayTitle').innerText = formattedTitle;

    const fileInput = document.getElementById('fileInput');
    const statusMsg = document.getElementById('statusMsg');
    const galleryGrid = document.getElementById('galleryGrid');

    // رفع الملفات لتيليجرام
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      statusMsg.style.display = 'block';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusMsg.innerText = `Uploading ${i + 1} of ${files.length}...`;

        // عرض فوري على الشاشة
        displayLocalMedia(file);

        // رفع لسيرفر تيليجرام
        const formData = new FormData();
        formData.append("chat_id", TELEGRAM_CHAT_ID);
        formData.append("caption", `✨ Event: ${formattedTitle}\n📅 Date: ${new Date().toLocaleString('ar-EG')}`);

        let endpoint = "sendDocument";
        if (file.type.startsWith("image/")) {
          endpoint = "sendPhoto";
          formData.append("photo", file);
        } else if (file.type.startsWith("video/")) {
          endpoint = "sendVideo";
          formData.append("video", file);
        } else {
          formData.append("document", file);
        }

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${endpoint}`, {
            method: "POST",
            body: formData
          });
        } catch (err) {
          console.error("Upload error:", err);
        }
      }

      statusMsg.innerText = "✨ Upload Complete!";
      setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
      fileInput.value = '';
    });

    function displayLocalMedia(file) {
      const card = document.createElement('div');
      card.className = 'media-card';
      const fileUrl = URL.createObjectURL(file);

      if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.controls = true;
        card.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = fileUrl;
        card.appendChild(img);
      }

      galleryGrid.prepend(card);
    }
  </script>
</body>
</html>
