<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 80px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(79, 70, 229, 0.4);
      color: #c7d2fe;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .action-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }

    .action-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .action-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .upload-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      color: #fff;
      transition: transform 0.1s ease;
    }

    .btn-photo {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);
    }

    .btn-video {
      background: linear-gradient(135deg, #ec4899, #be185d);
      box-shadow: 0 4px 15px rgba(190, 24, 93, 0.3);
    }

    .btn-gallery {
      grid-column: span 2;
      flex-direction: row;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      padding: 14px;
    }

    .upload-btn:active {
      transform: scale(0.96);
    }

    .tab-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .media-preview {
      position: relative;
      width: 100%;
      height: 160px;
      background: #000;
      cursor: pointer;
    }

    .media-preview img, .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: rgba(0,0,0,0.25);
    }

    .save-btn {
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .uploading-badge {
      padding: 10px;
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b4b;
      border: 1px solid var(--primary);
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 1000;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="action-card">
      <div class="header-badge" id="eventBadge">✨ General Event</div>
      <h1>Capture the Moment</h1>
      <p>Snap live moments or upload memories in real-time!</p>

      <div class="button-group">
        <label for="photoInput" class="upload-btn btn-photo">
          <span>📸</span>
          <span>Take Photo</span>
        </label>
        <label for="videoInput" class="upload-btn btn-video">
          <span>🎥</span>
          <span>Record Video</span>
        </label>
        <label for="galleryInput" class="upload-btn btn-gallery">
          <span>📁</span>
          <span>Upload from Gallery</span>
        </label>
      </div>

      <input type="file" id="photoInput" accept="image/*" capture="environment">
      <input type="file" id="videoInput" accept="video/*" capture="environment">
      <input type="file" id="galleryInput" accept="image/*,video/*" multiple>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="photosTab" onclick="switchTab('photos')">📸 Photos (<span id="photoCount">0</span>)</button>
      <button class="tab-btn" id="videosTab" onclick="switchTab('videos')">🎥 Videos (<span id="videoCount">0</span>)</button>
    </div>

    <div class="media-grid" id="photosGrid">
      <div class="empty-state">No photos yet! Snap one now. 📸</div>
    </div>

    <div class="media-grid" id="videosGrid" style="display: none;">
      <div class="empty-state">No videos yet! Record one now. 🎥</div>
    </div>
  </div>

  <div id="uploadToast" class="upload-toast">
    <span>⏳</span> <span id="toastText">Uploading in background...</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawEvent = urlParams.get('event');
    const eventName = rawEvent ? rawEvent.trim().toLowerCase().replace(/\s+/g, '_') : 'general_event';
    document.getElementById('eventBadge').innerText = "✨ " + eventName.replace(/_/g, ' ').toUpperCase();

    const CLOUD_NAME = "qwmaeyjl";
    const UPLOAD_PRESET = "events_upload";

    let activeTab = 'photos';
    let mediaState = { photos: [], videos: [] };
    let pendingUploads = 0;

    function updateToast() {
      const toast = document.getElementById('uploadToast');
      const toastText = document.getElementById('toastText');
      if (pendingUploads > 0) {
        toastText.innerText = `Uploading ${pendingUploads} item(s) in background...`;
        toast.style.display = 'flex';
      } else {
        toast.style.display = 'none';
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('photosTab').classList.toggle('active', tab === 'photos');
      document.getElementById('videosTab').classList.toggle('active', tab === 'videos');
      document.getElementById('photosGrid').style.display = tab === 'photos' ? 'grid' : 'none';
      document.getElementById('videosGrid').style.display = tab === 'videos' ? 'grid' : 'none';
    }

    function render() {
      document.getElementById('photoCount').innerText = mediaState.photos.length;
      document.getElementById('videoCount').innerText = mediaState.videos.length;

      const pGrid = document.getElementById('photosGrid');
      pGrid.innerHTML = mediaState.photos.length === 0 
        ? '<div class="empty-state">No photos yet! Snap one now. 📸</div>'
        : mediaState.photos.map(renderCard).join('');

      const vGrid = document.getElementById('videosGrid');
      vGrid.innerHTML = mediaState.videos.length === 0 
        ? '<div class="empty-state">No videos yet! Record one now. 🎥</div>'
        : mediaState.videos.map(renderCard).join('');
    }

    function renderCard(item) {
      const isVid = item.type === 'video';
      const preview = isVid 
        ? `<video src="${item.url}" playsinline muted></video><div class="video-play-icon">▶️</div>`
        : `<img src="${item.url}" loading="lazy">`;

      const bottomBar = item.uploading
        ? `<div class="uploading-badge">⏳ Uploading...</div>`
        : `<button class="save-btn" onclick="window.open('${item.url}', '_blank')">⬇️ Save ${isVid ? 'Video' : 'Photo'}</button>`;

      return `
        <div class="media-card">
          <div class="media-preview" onclick="window.open('${item.url}', '_blank')">${preview}</div>
          ${bottomBar}
        </div>
      `;
    }

    // بث لحظي للـ 500 معزوم عبر شبكة Real-time NTFY Channel
    function broadcastMedia(newItem) {
      fetch(`https://ntfy.sh/event_feed_${eventName}`, {
        method: 'POST',
        body: JSON.stringify(newItem)
      }).catch(e => console.error(e));
    }

    // استقبال فوري لأي صورة يرفعها أي شخص في نفس اللحظة
    function listenToLiveFeed() {
      const eventSource = new EventSource(`https://ntfy.sh/event_feed_${eventName}/sse`);
      eventSource.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg && msg.message) {
            const data = JSON.parse(msg.message);
            if (data && data.url) {
              const list = data.type === 'video' ? mediaState.videos : mediaState.photos;
              if (!list.some(i => i.url === data.url)) {
                list.unshift(data);
                render();
              }
            }
          }
        } catch (e) {
          // ignore non-json messages
        }
      };
    }

    async function uploadWorker(file) {
      const isVideo = file.type.startsWith('video') || file.name.match(/\.(mov|mp4|avi)$/i);
      const tempId = 'temp_' + Date.now() + Math.random();
      const localUrl = URL.createObjectURL(file);

      const tempItem = { id: tempId, url: localUrl, type: isVideo ? 'video' : 'image', uploading: true };
      if (isVideo) mediaState.videos.unshift(tempItem);
      else mediaState.photos.unshift(tempItem);

      render();
      pendingUploads++;
      updateToast();

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", eventName);
      formData.append("tags", eventName);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${isVideo ? 'video' : 'image'}/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        
        const list = isVideo ? mediaState.videos : mediaState.photos;
        const target = list.find(i => i.id === tempId);
        if (target && data.secure_url) {
          target.url = data.secure_url;
          target.uploading = false;

          // بث مباشر فوري لجميع الموبايلات المفتوحة حالياً
          broadcastMedia({
            id: data.public_id,
            url: data.secure_url,
            type: isVideo ? 'video' : 'image',
            uploading: false
          });
        }
      } catch (err) {
        console.error(err);
      } finally {
        pendingUploads--;
        updateToast();
        render();
      }
    }

    function handleFiles(files) {
      if (!files) return;
      Array.from(files).forEach(uploadWorker);
    }

    document.getElementById('photoInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
    document.getElementById('videoInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
    document.getElementById('galleryInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

    // تحميل الصور القديمة لأول مرة
    async function loadCloudMedia() {
      try {
        const [imgs, vids] = await Promise.allSettled([
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${eventName}.json?cb=${Date.now()}`).then(r => r.json()),
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/${eventName}.json?cb=${Date.now()}`).then(r => r.json())
        ]);

        if (imgs.status === 'fulfilled' && imgs.value.resources) {
          imgs.value.resources.forEach(r => {
            const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${r.version}/${r.public_id}.${r.format}`;
            if (!mediaState.photos.some(p => p.url === url)) {
              mediaState.photos.push({ id: r.public_id, url, type: 'image', uploading: false });
            }
          });
        }

        if (vids.status === 'fulfilled' && vids.value.resources) {
          vids.value.resources.forEach(r => {
            const url = `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${r.version}/${r.public_id}.${r.format}`;
            if (!mediaState.videos.some(v => v.url === url)) {
              mediaState.videos.push({ id: r.public_id, url, type: 'video', uploading: false });
            }
          });
        }
        render();
      } catch (e) {
        console.error(e);
      }
    }

    loadCloudMedia();
    listenToLiveFeed();
  </script>
</body>
</html>
