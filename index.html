<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F8FAF7;
      --card-bg: #FFFFFF;
      --text-main: #233324;
      --text-muted: #5D705E;
      --olive-primary: #4A6342;
      --olive-dark: #374B31;
      --olive-light: #EDF3EC;
      --card-border: #D5E2D3;
      --accent-gold: #C2A649;
    }

    body.theme-gold {
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #2A241E;
      --text-muted: #7A6F64;
      --olive-primary: #C5A059;
      --olive-dark: #9E7D3B;
      --olive-light: #F7F2E7;
      --card-border: #E8DEC8;
    }

    body.theme-navy {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --olive-primary: #38BDF8;
      --olive-dark: #0284C7;
      --olive-light: #1E293B;
      --card-border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header { text-align: center; margin-bottom: 24px; }
    .sparkle { color: var(--accent-gold); font-size: 24px; margin-bottom: 6px; }
    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--olive-primary);
    }
    .event-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

    .upload-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(74, 99, 66, 0.08);
      margin-bottom: 20px;
    }

    .upload-btn {
      width: 100%;
      background: var(--olive-primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      width: 100%;
      background: var(--olive-light);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--olive-primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .gallery-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--olive-light);
      border: 1px solid var(--card-border);
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="sparkle">✦ ✧ ✦</div>
      <h1 class="event-title" id="eventTitle">Wedding Memories</h1>
      <p class="event-subtitle">Share your live photos & videos with the couple</p>
    </div>

    <div class="upload-card">
      <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
        <span>📸 / 🎥 Add Memories</span>
      </button>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple />
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="photosTab" onclick="switchTab('photos')">📷 Photos (<span id="photoCount">0</span>)</button>
      <button class="tab-btn" id="videosTab" onclick="switchTab('videos')">🎥 Videos (<span id="videoCount">0</span>)</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-state" id="emptyState">No memories yet. Be the first to share!</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://nameless-king-3d15.marwanselim360.workers.dev";

    const urlParams = new URLSearchParams(window.location.search);
    const rawEvent = urlParams.get('event') || 'Omar_Nour';
    const eventName = decodeURIComponent(rawEvent.replace(/_/g, ' '));
    const eventTag = '#event_' + rawEvent.toLowerCase().replace(/[^a-z0-9]/g, '');
    const themeName = urlParams.get('theme') || 'olive';

    document.getElementById('eventTitle').innerText = eventName;
    if (themeName !== 'olive') {
      document.body.classList.add('theme-' + themeName);
    }

    let photos = [];
    let videos = [];
    let currentTab = 'photos';
    const fileInput = document.getElementById('fileInput');

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('photosTab').classList.toggle('active', tab === 'photos');
      document.getElementById('videosTab').classList.toggle('active', tab === 'videos');
      renderGallery();
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';
      const items = currentTab === 'photos' ? photos : videos;

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No ${currentTab} uploaded yet for this event.<br>Be the first to share!</div>`;
        return;
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        if (item.type === 'photo') {
          div.innerHTML = `<img src="${item.url}" alt="Memory" loading="lazy" />`;
        } else {
          div.innerHTML = `<video src="${item.url}" muted playsinline loop autoplay controls></video>`;
        }
        grid.appendChild(div);
      });
    }

    async function fetchSharedLiveGallery() {
      try {
        const res = await fetch(`${WORKER_URL}?tag=${encodeURIComponent(eventTag)}`);
        const data = await res.json();
        
        if (!data.ok || !data.result) return;

        const newPhotos = [];
        const newVideos = [];

        data.result.forEach(item => {
          const mediaObj = {
            url: `${WORKER_URL}?file_id=${item.file_id}`,
            type: item.type
          };
          if (item.type === 'video') newVideos.push(mediaObj);
          else newPhotos.push(mediaObj);
        });

        photos = newPhotos;
        videos = newVideos;

        document.getElementById('photoCount').innerText = photos.length;
        document.getElementById('videoCount').innerText = videos.length;
        renderGallery();
      } catch (err) {}
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.innerHTML = `<span>⏳ Uploading...</span>`;
      uploadBtn.disabled = true;

      for (const file of files) {
        const isVideo = file.type.startsWith('video');
        const formData = new FormData();
        formData.append('file', file);
        formData.append('tag', eventTag);
        formData.append('is_video', isVideo ? 'true' : 'false');

        try {
          const res = await fetch(WORKER_URL, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.ok && data.item) {
            const mediaObj = {
              url: `${WORKER_URL}?file_id=${data.item.file_id}`,
              type: data.item.type
            };
            if (isVideo) {
              videos.unshift(mediaObj);
              switchTab('videos');
            } else {
              photos.unshift(mediaObj);
              switchTab('photos');
            }
            renderGallery();
          }
        } catch (err) {}
      }

      uploadBtn.innerHTML = `<span>📸 / 🎥 Add Memories</span>`;
      uploadBtn.disabled = false;
      fileInput.value = '';
    });

    fetchSharedLiveGallery();
    setInterval(fetchSharedLiveGallery, 5000);
  </script>
</body>
</html>
