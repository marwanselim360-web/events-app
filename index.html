<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #F9FBF8;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-main: #263322;
    --text-muted: #62725C;
    --accent-btn: #4B5E43;
    --accent-hover: #3B4A34;
    --btn-text: #FFFFFF;
    --card-border: rgba(75, 94, 67, 0.15);
  }

  body.theme-gold {
    --bg-primary: #FAF8F5;
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-main: #2A241E;
    --text-muted: #7A6F64;
    --accent-btn: #C5A059;
    --accent-hover: #B08D46;
    --btn-text: #FFFFFF;
    --card-border: rgba(197, 160, 89, 0.25);
  }

  body.theme-navy {
    --bg-primary: #0F172A;
    --card-bg: rgba(30, 41, 59, 0.7);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --accent-btn: #38BDF8;
    --accent-hover: #0284C7;
    --btn-text: #0F172A;
    --card-border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body {
    background: var(--bg-primary);
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.3s ease;
  }

  .header { text-align: center; margin-bottom: 24px; }
  .sparkle { font-size: 28px; margin-bottom: 8px; }
  .event-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-main); }
  .event-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

  .upload-box {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    text-align: center;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }

  .upload-btn {
    background: var(--accent-btn);
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .upload-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

  .gallery {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1;
    background: #EAEFE7;
    border: 1px solid var(--card-border);
  }

  .gallery-item img, .gallery-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .status-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="wedding-header">
      <div class="monogram" id="displayMonogram">✨</div>
      <h1 class="wedding-title" id="displayTitle">Live Event Album</h1>
      <p class="wedding-subtitle">Share your live moments with us</p>
    </div>

    <div class="upload-card">
      <label for="fileInput" class="custom-upload-btn">📸 Add Photos & Videos</label>
      <input type="file" id="fileInput" multiple accept="image/*,video/*">
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <script>
    // بيانات تيليجرام
    const TELEGRAM_BOT_TOKEN = "8921464117:AAE-EDpZ09tXc0hiCInYr3bN9s8ZLkr8p_w";
    const TELEGRAM_CHAT_ID = "-1004372146565";

    // قراءة باراميترات الرابط تلقائياً
    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('event') || 'Our Wedding';
    const themeName = urlParams.get('theme');

    // تطبيق الثيم
    if (themeName === 'olive') {
      document.body.classList.add('theme-olive');
    }

    // عرض اسم الإيفنت
    const formattedTitle = eventName.replace(/_/g, ' ');
    document.getElementById('displayTitle').innerText = formattedTitle;

    const fileInput = document.getElementById('fileInput');
    const statusMsg = document.getElementById('statusMsg');
    const galleryGrid = document.getElementById('galleryGrid');

    // رفع الملفات لتيليجرام
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      statusMsg.style.display = 'block';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusMsg.innerText = `Uploading ${i + 1} of ${files.length}...`;

        // عرض فوري على الشاشة
        displayLocalMedia(file);

        // رفع لسيرفر تيليجرام
        const formData = new FormData();
        formData.append("chat_id", TELEGRAM_CHAT_ID);
        formData.append("caption", `✨ Event: ${formattedTitle}\n📅 Date: ${new Date().toLocaleString('ar-EG')}`);

        let endpoint = "sendDocument";
        if (file.type.startsWith("image/")) {
          endpoint = "sendPhoto";
          formData.append("photo", file);
        } else if (file.type.startsWith("video/")) {
          endpoint = "sendVideo";
          formData.append("video", file);
        } else {
          formData.append("document", file);
        }

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${endpoint}`, {
            method: "POST",
            body: formData
          });
        } catch (err) {
          console.error("Upload error:", err);
        }
      }

      statusMsg.innerText = "✨ Upload Complete!";
      setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
      fileInput.value = '';
    });

    function displayLocalMedia(file) {
      const card = document.createElement('div');
      card.className = 'media-card';
      const fileUrl = URL.createObjectURL(file);

      if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.controls = true;
        card.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = fileUrl;
        card.appendChild(img);
      }

      galleryGrid.prepend(card);
    }
  </script>
</body>
</html>
