<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Photo Upload</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    h2 { margin-bottom: 8px; color: #4facfe; }
    p { color: #aaa; font-size: 14px; margin-bottom: 24px; }
    .upload-btn {
      display: inline-block;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      padding: 16px 32px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .upload-btn:active { transform: scale(0.98); }
    #fileInput { display: none; }
    #status { margin-top: 20px; font-weight: bold; color: #00f2fe; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="eventTitle">مرحباً بك!</h2>
    <p>التقط صورة لترفعها مباشرة للإيفنت</p>

    <label for="fileInput" class="upload-btn">📸 افتح الكاميرا وصوّر</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <div id="status"></div>
  </div>

  <script>
    // 1️⃣ قراءة اسم الإيفنت من اللينك
    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('event') || 'General_Event';
    
    document.getElementById('eventTitle').innerText = "إيفنت: " + eventName.replace(/_/g, ' ');

    // 2️⃣ مفتاح ImgBB API الخاص بك
    const IMGBB_API_KEY = "96164ba5f1273f260a825900d14e7e9a";

    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusDiv.innerText = "جاري رفع الصورة... ⏳";
      statusDiv.style.color = "#00f2fe";

      const formData = new FormData();
      const customFileName = `${eventName}_${Date.now()}.jpg`;
      formData.append("image", file, customFileName);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.innerText = "✅ تم رفع الصورة بنجاح!";
          statusDiv.style.color = "#00ff88";
        } else {
          statusDiv.innerText = "❌ حدث خطأ أثناء الرفع.";
          statusDiv.style.color = "#ff4d4d";
        }
      } catch (err) {
        console.error(err);
        statusDiv.innerText = "❌ تعذر الاتصال بالسيرفر.";
        statusDiv.style.color = "#ff4d4d";
      }
    });
  </script>

</body>
</html>
