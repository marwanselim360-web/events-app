<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Media Uploader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .event-badge {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 26px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .action-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 15px;
      border-radius: 14px;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: transform 0.1s ease;
    }
    .action-btn.video-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    input[type="file"] {
      display: none;
    }
    .status-box {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 600;
      min-height: 24px;
    }
    .preview-container {
      margin-top: 18px;
      display: none;
    }
    .preview-container img, .preview-container video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="event-badge" id="eventDisplay">Event: Loading...</div>
    <h1>Capture the Moment! 📸🎥</h1>
    <p>Take a photo or record a video to automatically upload it to the event album.</p>

    <div class="btn-group">
      <!-- Take Photo Button -->
      <label for="photoInput" class="action-btn">📸 Take Photo</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment">

      <!-- Record Video Button -->
      <label for="videoInput" class="action-btn video-btn">🎥 Record Video</label>
      <input type="file" id="videoInput" accept="video/*" capture="camcorder">
    </div>

    <div class="preview-container" id="previewContainer">
      <img id="imagePreview" style="display: none;" alt="Preview">
      <video id="videoPreview" controls style="display: none;"></video>
    </div>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    // 1. Get event name from URL
    const urlParams = new URLSearchParams(window.location.search);
    const rawEvent = urlParams.get('event');
    const eventName = rawEvent ? rawEvent.trim() : 'General_Event';
    document.getElementById('eventDisplay').innerText = "Event: " + eventName.replace(/_/g, ' ');

    // 2. Cloudinary Credentials
    const CLOUD_NAME = "qwmaeyjl";
    const UPLOAD_PRESET = "events_upload";

    const photoInput = document.getElementById('photoInput');
    const videoInput = document.getElementById('videoInput');
    const statusBox = document.getElementById('statusBox');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const videoPreview = document.getElementById('videoPreview');

    // Upload Handler
    async function uploadMedia(file, resourceType) {
      if (!file) return;

      previewContainer.style.display = "block";
      if (resourceType === 'image') {
        videoPreview.style.display = "none";
        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = "block";
      } else {
        imagePreview.style.display = "none";
        videoPreview.src = URL.createObjectURL(file);
        videoPreview.style.display = "block";
      }

      statusBox.style.color = "#38bdf8";
      statusBox.innerText = "Uploading to album... ⏳";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", eventName); // Automatically groups by event folder

      try {
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.secure_url) {
          statusBox.style.color = "#4ade80";
          statusBox.innerText = "✅ Uploaded successfully!";
        } else {
          statusBox.style.color = "#f87171";
          statusBox.innerText = "❌ Upload failed. Please try again.";
        }
      } catch (err) {
        console.error(err);
        statusBox.style.color = "#f87171";
        statusBox.innerText = "❌ Connection error. Check your internet.";
      }
    }

    photoInput.addEventListener('change', (e) => uploadMedia(e.target.files[0], 'image'));
    videoInput.addEventListener('change', (e) => uploadMedia(e.target.files[0], 'video'));
  </script>

</body>
</html>
