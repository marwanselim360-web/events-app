<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Wedding Gallery ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
    }

    .media-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e293b;
      cursor: pointer;
    }

    .media-card img, 
    .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Floating Upload Button */
    .upload-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 60;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 95vw;
      max-height: 85vh;
      border-radius: 8px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 32px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Emma & Alex's Wedding 💍</h1>
    <p>Live Guest Photo & Video Stream</p>
  </header>

  <main class="gallery-container">
    <div id="gallery" class="gallery-grid"></div>
  </main>

  <label for="fileInput" class="upload-btn">
    📷 Add Photos / Videos
  </label>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;">

  <!-- Modal -->
  <div id="mediaModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <div id="modalBody"></div>
  </div>

  <script>
    // صور تجريبية مبدئية عشان الديمو ميكونش فاضي للعميل
    const sampleMedia = [
      { type: 'image', url: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=500&auto=format&fit=crop' },
      { type: 'image', url: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=500&auto=format&fit=crop' },
      { type: 'image', url: 'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=500&auto=format&fit=crop' },
      { type: 'image', url: 'https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=500&auto=format&fit=crop' },
      { type: 'image', url: 'https://images.unsplash.com/photo-1520854221256-17451cc331bf?w=500&auto=format&fit=crop' },
      { type: 'image', url: 'https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=500&auto=format&fit=crop' }
    ];

    const gallery = document.getElementById('gallery');

    function renderMedia(item) {
      const card = document.createElement('div');
      card.className = 'media-card';
      if (item.type === 'video') {
        card.innerHTML = `<video src="${item.url}#t=0.001" preload="metadata" muted playsinline></video>`;
        card.onclick = () => openModal('video', item.url);
      } else {
        card.innerHTML = `<img src="${item.url}" loading="lazy" alt="wedding moment">`;
        card.onclick = () => openModal('image', item.url);
      }
      gallery.prepend(card);
    }

    // عرض الصور المبدئية
    sampleMedia.forEach(renderMedia);

    // رفع صور لايف من الموبايل في الديمو
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const type = file.type.startsWith('video') ? 'video' : 'image';
        renderMedia({ type, url });
      });
    });

    function openModal(type, url) {
      const modal = document.getElementById('mediaModal');
      const body = document.getElementById('modalBody');
      modal.style.display = 'flex';
      if (type === 'video') {
        body.innerHTML = `<video class="modal-content" src="${url}" controls autoplay playsinline></video>`;
      } else {
        body.innerHTML = `<img class="modal-content" src="${url}">`;
      }
    }

    function closeModal() {
      document.getElementById('mediaModal').style.display = 'none';
      document.getElementById('modalBody').innerHTML = '';
    }
  </script>
</body>
</html>
