<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Event Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a6342;
      --bg: #f8faf7;
      --text: #111827;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --muted: #64748b;
    }

    body.dark-theme {
      --text: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 20px 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--primary);
      color: #fff;
      margin-bottom: 8px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .upload-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }

    .btn-upload {
      width: 100%;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-upload:active { transform: scale(0.98); }

    .tabs {
      display: flex;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .media-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1;
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty {
      grid-column: span 2;
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox.active { display: flex; }

    .lightbox-content {
      max-width: 100%;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      object-fit: contain;
    }

    .lightbox-controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-ctrl {
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-save { background: var(--primary); color: #fff; }
    .btn-exit { background: rgba(255,255,255,0.2); color: #fff; }

    #picker { display: none; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <div class="badge" id="eventBadge">Event</div>
      <h1 class="title" id="eventTitle">Live Moments</h1>
      <p class="subtitle" id="eventSub">Capture and share live memories</p>
    </div>

    <div class="upload-container">
      <button class="btn-upload" id="uploadAction" onclick="document.getElementById('picker').click()">
        <span>📸 Add Photo / Video</span>
      </button>
      <input type="file" id="picker" accept="image/*,video/*" multiple />
    </div>

    <div class="tabs">
      <button class="tab active" id="tabP" onclick="switchMedia('p')">📷 Photos (<span id="countP">0</span>)</button>
      <button class="tab" id="tabV" onclick="switchMedia('v')">🎥 Videos (<span id="countV">0</span>)</button>
    </div>

    <div class="gallery" id="mediaGrid">
      <div class="empty">Loading live stream...</div>
    </div>
  </div>

  <div class="lightbox" id="viewer" onclick="if(event.target === this) closeViewer()">
    <div class="lightbox-content" id="viewerTarget"></div>
    <div class="lightbox-controls">
      <a href="#" id="viewerDl" download class="btn-ctrl btn-save">⬇ Download</a>
      <button class="btn-ctrl btn-exit" onclick="closeViewer()">✕ Close</button>
    </div>
  </div>

  <script>
    const API = "https://nameless-king-3d15.marwanselim360.workers.dev";
    const q = new URLSearchParams(window.location.search);

    const tag = '#event_' + (q.get('event') || 'general').toLowerCase().replace(/[^a-z0-9]/g, '');
    const title = q.get('title') || 'Live Event';
    const type = q.get('type') || 'Celebration';
    const sub = q.get('sub') || 'Live shared album';
    const pCol = '#' + (q.get('p') || '4a6342');
    const bCol = '#' + (q.get('bg') || 'f8faf7');

    document.getElementById('eventTitle').innerText = decodeURIComponent(title);
    document.getElementById('eventBadge').innerText = decodeURIComponent(type);
    document.getElementById('eventSub').innerText = decodeURIComponent(sub);
    document.documentElement.style.setProperty('--primary', pCol);
    document.documentElement.style.setProperty('--bg', bCol);

    function isDark(hex) {
      const c = hex.replace('#', '');
      const rgb = parseInt(c, 16);
      const r = (rgb >> 16) & 0xff;
      const g = (rgb >> 8) & 0xff;
      const b = (rgb >> 0) & 0xff;
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128;
    }
    if (isDark(bCol)) document.body.classList.add('dark-theme');

    let current = 'p';
    let photoData = [];
    let videoData = [];

    function switchMedia(t) {
      current = t;
      document.getElementById('tabP').classList.toggle('active', t === 'p');
      document.getElementById('tabV').classList.toggle('active', t === 'v');
      draw();
    }

    function openViewer(url, isVideo) {
      const box = document.getElementById('viewer');
      const target = document.getElementById('viewerTarget');
      const dl = document.getElementById('viewerDl');
      dl.href = url;
      dl.setAttribute('download', isVideo ? 'video.mp4' : 'photo.jpg');

      if (isVideo) {
        target.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
      } else {
        target.innerHTML = `<img src="${url}" alt="Memory" />`;
      }
      box.classList.add('active');
    }

    function closeViewer() {
      document.getElementById('viewerTarget').innerHTML = '';
      document.getElementById('viewer').classList.remove('active');
    }

    function draw() {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';
      const list = current === 'p' ? photoData : videoData;

      if (!list.length) {
        grid.innerHTML = `<div class="empty">No ${current === 'p' ? 'photos' : 'videos'} uploaded yet.<br>Be the first to share!</div>`;
        return;
      }

      list.forEach(item => {
        const d = document.createElement('div');
        d.className = 'media-card';
        if (item.type === 'video') {
          d.innerHTML = `<video src="${item.url}" playsinline preload="metadata" muted></video>`;
          d.onclick = () => openViewer(item.url, true);
        } else {
          d.innerHTML = `<img src="${item.url}" loading="lazy" alt="Media" />`;
          d.onclick = () => openViewer(item.url, false);
        }
        grid.appendChild(d);
      });
    }

    async function fetchStream() {
      try {
        const res = await fetch(`${API}?tag=${encodeURIComponent(tag)}`);
        const data = await res.json();
        if (data.ok && data.result) {
          const p = [];
          const v = [];
          data.result.forEach(item => {
            const entry = { url: `${API}?file_id=${item.file_id}`, type: item.type };
            if (item.type === 'video') v.push(entry);
            else p.push(entry);
          });
          photoData = p;
          videoData = v;
          document.getElementById('countP').innerText = p.length;
          document.getElementById('countV').innerText = v.length;
          draw();
        }
      } catch (e) {}
    }

    document.getElementById('picker').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const btn = document.getElementById('uploadAction');
      btn.innerHTML = `<span>⏳ Uploading...</span>`;
      btn.disabled = true;

      for (const file of files) {
        const isVideo = file.type.startsWith('video');
        const fd = new FormData();
        fd.append('file', file);
        fd.append('tag', tag);
        fd.append('is_video', isVideo ? 'true' : 'false');

        try {
          const res = await fetch(API, { method: 'POST', body: fd });
          const resData = await res.json();
          if (resData.ok && resData.item) {
            const entry = { url: `${API}?file_id=${resData.item.file_id}`, type: resData.item.type };
            if (isVideo) {
              videoData.unshift(entry);
              switchMedia('v');
            } else {
              photoData.unshift(entry);
              switchMedia('p');
            }
          }
        } catch (err) {}
      }

      btn.innerHTML = `<span>📸 Add Photo / Video</span>`;
      btn.disabled = false;
      e.target.value = '';
      fetchStream();
    });

    fetchStream();
    setInterval(fetchStream, 3500);
  </script>
</body>
</html>
