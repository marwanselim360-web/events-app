<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F7F8F5;
      --card-bg: #FFFFFF;
      --text-main: #2C3E2D;
      --text-muted: #657566;
      --olive-primary: #526E48;
      --olive-dark: #3B5332;
      --olive-light: #EBF0E9;
      --card-border: #D8E2D6;
      --accent-gold: #C2A649;
    }

    body.theme-gold {
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #2A241E;
      --text-muted: #7A6F64;
      --olive-primary: #C5A059;
      --olive-dark: #9E7D3B;
      --olive-light: #F7F2E7;
      --card-border: #E8DEC8;
    }

    body.theme-navy {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --olive-primary: #38BDF8;
      --olive-dark: #0284C7;
      --olive-light: #1E293B;
      --card-border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .sparkle {
      color: var(--accent-gold);
      font-size: 26px;
      margin-bottom: 6px;
    }

    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--olive-primary);
    }

    .event-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .upload-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px rgba(82, 110, 72, 0.08);
      text-align: center;
      margin-bottom: 24px;
    }

    .upload-btn {
      width: 100%;
      background: var(--olive-primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 12px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(82, 110, 72, 0.25);
      transition: all 0.2s ease;
    }

    .upload-btn:active {
      background: var(--olive-dark);
      transform: scale(0.98);
    }

    .tabs {
      display: flex;
      width: 100%;
      background: var(--olive-light);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 18px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--olive-primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .gallery-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--olive-light);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(44, 62, 45, 0.85);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="sparkle">✦ ✧ ✦</div>
      <h1 class="event-title" id="eventTitle">Wedding Memories</h1>
      <p class="event-subtitle">Share your live photos & videos with the couple</p>
    </div>

    <div class="upload-card">
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <span>📸 / 🎥 Add Memories</span>
      </button>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple />
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="photosTab" onclick="switchTab('photos')">📷 Photos (<span id="photoCount">0</span>)</button>
      <button class="tab-btn" id="videosTab" onclick="switchTab('videos')">🎥 Videos (<span id="videoCount">0</span>)</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-state" id="emptyState">No photos uploaded yet.<br>Be the first to share a moment!</div>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8921464117:AAFXf6K_2B48xI1D084z-ZJ4lZ47Y2-xR2w";
    const CHAT_ID = "-1003893309503";

    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('event') ? decodeURIComponent(urlParams.get('event').replace(/_/g, ' ')) : 'Omar & Merna';
    const themeName = urlParams.get('theme') || 'olive';

    document.getElementById('eventTitle').innerText = eventName;
    if (themeName !== 'olive') {
      document.body.classList.add('theme-' + themeName);
    }

    let photos = [];
    let videos = [];
    let currentTab = 'photos';

    const fileInput = document.getElementById('fileInput');

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('photosTab').classList.toggle('active', tab === 'photos');
      document.getElementById('videosTab').classList.toggle('active', tab === 'videos');
      renderGallery();
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';
      const items = currentTab === 'photos' ? photos : videos;

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No ${currentTab} uploaded yet.<br>Be the first to share!</div>`;
        return;
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        
        if (item.type === 'photo') {
          div.innerHTML = `<img src="${item.url}" alt="Memory" />
                           <div class="status-badge">${item.status}</div>`;
        } else {
          div.innerHTML = `<video src="${item.url}" muted playsinline loop autoplay></video>
                           <div class="status-badge">${item.status}</div>`;
        }
        grid.appendChild(div);
      });
    }

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const isVideo = file.type.startsWith('video');
        const previewUrl = URL.createObjectURL(file);
        
        const memoryItem = {
          url: previewUrl,
          type: isVideo ? 'video' : 'photo',
          status: '✅ Added'
        };

        if (isVideo) {
          videos.unshift(memoryItem);
          document.getElementById('videoCount').innerText = videos.length;
          switchTab('videos');
        } else {
          photos.unshift(memoryItem);
          document.getElementById('photoCount').innerText = photos.length;
          switchTab('photos');
        }

        renderGallery();
        uploadToTelegram(file);
      });

      fileInput.value = '';
    });

    async function uploadToTelegram(file) {
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('document', file);
      formData.append('caption', `🎉 ${eventName}\nType: ${file.type.startsWith('video') ? 'Video' : 'Photo'}`);

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
          method: 'POST',
          body: formData
        });
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
