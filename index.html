<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Wedding Gallery ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Gallery Grid */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }

    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }
    }

    .media-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background-color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .media-card img, 
    .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .media-card:hover img,
    .media-card:hover video {
      transform: scale(1.04);
    }

    .video-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    /* Status & Loading */
    .status-container {
      text-align: center;
      padding: 24px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(251, 191, 36, 0.2);
      border-radius: 50%;
      border-top-color: #fbbf24;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal / Lightbox */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 32px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Emma & Alex's Wedding 💍</h1>
    <p>Live Guest Photo & Video Stream</p>
  </header>

  <main class="gallery-container">
    <div id="gallery" class="gallery-grid"></div>

    <div id="status" class="status-container">
      <div id="spinner" class="spinner"></div>
      <div id="status-text">Loading live moments... ✨</div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="mediaModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <div id="modalBody"></div>
  </div>

  <script>
    /* ==========================================================
       CONFIGURATION & STATE
       ========================================================== */
    const API_ENDPOINT = '/api/gallery'; // مسار الـ API بتاعك
    const BATCH_SIZE = 24;               // عدد الصور في كل دفعة تحميل
    
    let currentPage = 1;
    let isFetching = false;
    let hasMore = true;

    const galleryElement = document.getElementById('gallery');
    const statusContainer = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');

    /* ==========================================================
       FETCH & RENDER LOGIC (Infinite Scroll)
       ========================================================== */
    async function loadMoreMedia() {
      if (isFetching || !hasMore) return;
      
      isFetching = true;
      spinner.style.display = 'inline-block';
      statusText.innerText = 'Loading more moments... ✨';

      try {
        const response = await fetch(`${API_ENDPOINT}?page=${currentPage}&limit=${BATCH_SIZE}`);
        const data = await response.json();

        if (!data.media || data.media.length === 0) {
          hasMore = false;
          spinner.style.display = 'none';
          statusText.innerText = 'You’ve reached the end of the album 🤍';
          return;
        }

        renderItems(data.media);
        currentPage++;

      } catch (error) {
        console.error('Error fetching media:', error);
        statusText.innerText = 'Tap to retry loading ✨';
      } finally {
        isFetching = false;
        if (hasMore) {
          spinner.style.display = 'none';
          statusText.innerText = '';
        }
      }
    }

    function renderItems(items) {
      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card';

        if (item.type === 'video') {
          card.innerHTML = `
            <video src="${item.url}#t=0.001" preload="metadata" muted playsinline></video>
            <span class="video-badge">▶ Video</span>
          `;
          card.onclick = () => openModal('video', item.url);
        } else {
          card.innerHTML = `
            <img src="${item.url}" loading="lazy" alt="Guest photo">
          `;
          card.onclick = () => openModal('photo', item.url);
        }

        fragment.appendChild(card);
      });

      galleryElement.appendChild(fragment);
    }

    /* ==========================================================
       SCROLL EVENT LISTENER
       ========================================================== */
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 600)) {
        loadMoreMedia();
      }
    });

    /* ==========================================================
       LIGHTBOX / PREVIEW HANDLER
       ========================================================== */
    function openModal(type, url) {
      const modal = document.getElementById('mediaModal');
      const modalBody = document.getElementById('modalBody');
      modal.style.display = 'flex';

      if (type === 'video') {
        modalBody.innerHTML = `<video class="modal-content" src="${url}" controls autoplay playsinline></video>`;
      } else {
        modalBody.innerHTML = `<img class="modal-content" src="${url}" alt="Full size preview">`;
      }
    }

    function closeModal() {
      const modal = document.getElementById('mediaModal');
      const modalBody = document.getElementById('modalBody');
      modal.style.display = 'none';
      modalBody.innerHTML = '';
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', () => {
      loadMoreMedia();
    });
  </script>
</body>
</html>
