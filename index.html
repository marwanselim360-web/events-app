<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Event Album & Gallery</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #38bdf8;
      --primary-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 18px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      margin-bottom: 24px;
    }
    .event-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 16px;
      text-transform: capitalize;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 10px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      border: none;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-photo { background: var(--primary-gradient); }
    .btn-video { background: var(--accent-gradient); }
    .btn-icon { font-size: 24px; }
    input[type="file"] { display: none; }

    .status-alert {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      display: none;
      margin-top: 14px;
      animation: fadeIn 0.3s ease;
    }
    .status-loading { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .status-success { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-error { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    /* Event Live Gallery Section */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 4px 16px;
    }
    .gallery-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 100px;
      cursor: pointer;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .gallery-card {
      position: relative;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 1 / 1.1;
      display: flex;
      flex-direction: column;
    }
    .gallery-media-wrapper {
      flex: 1;
      position: relative;
      background: #0b1120;
      overflow: hidden;
    }
    .gallery-card img, .gallery-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .download-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 10px;
      color: #64748b;
      font-size: 14px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Upload Card -->
    <div class="card">
      <div class="event-tag" id="eventBadge">✨ Live Event</div>
      <h1>Capture the Moment</h1>
      <p class="subtitle">Snap photos or record clips to add them instantly to the wedding album!</p>

      <div class="actions-grid">
        <label for="photoInput" class="btn btn-photo">
          <span class="btn-icon">📸</span>
          <span>Take Photo</span>
        </label>
        <input type="file" id="photoInput" accept="image/*" capture="environment">

        <label for="videoInput" class="btn btn-video">
          <span class="btn-icon">🎥</span>
          <span>Record Video</span>
        </label>
        <input type="file" id="videoInput" accept="video/*" capture="camcorder">
      </div>

      <div id="statusBox" class="status-alert"></div>
    </div>

    <!-- Live Event Gallery -->
    <div class="gallery-header">
      <h2>🎉 Event Live Album</h2>
      <button class="refresh-btn" onclick="fetchEventMedia()">🔄 Refresh</button>
    </div>

    <div class="gallery-grid" id="mainGallery">
      <div class="empty-state">Loading event media... ⏳</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawEvent = urlParams.get('event');
    const eventName = rawEvent ? rawEvent.trim().replace(/\s+/g, '_') : 'General_Event';
    document.getElementById('eventBadge').innerText = "✨ " + eventName.replace(/_/g, ' ');

    const CLOUD_NAME = "qwmaeyjl";
    const UPLOAD_PRESET = "events_upload";

    const photoInput = document.getElementById('photoInput');
    const videoInput = document.getElementById('videoInput');
    const statusBox = document.getElementById('statusBox');
    const mainGallery = document.getElementById('mainGallery');

    function setStatus(msg, type) {
      statusBox.className = `status-alert status-${type}`;
      statusBox.innerText = msg;
      statusBox.style.display = "block";
    }

    // Download helper
    async function downloadFile(url, filename) {
      const response = await fetch(url);
      const blob = await response.blob();
      const blobUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function createMediaCard(url, type) {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      const filename = `${eventName}_${Date.now()}.${type === 'image' ? 'jpg' : 'mp4'}`;
      
      const mediaHtml = type === 'image' 
        ? `<img src="${url}" loading="lazy" alt="Moment">`
        : `<video src="${url}" controls playsinline></video>`;

      card.innerHTML = `
        <div class="gallery-media-wrapper">
          ${mediaHtml}
          <a href="javascript:void(0)" class="download-btn" onclick="downloadFile('${url}', '${filename}')">
            ⬇️ Save
          </a>
        </div>
      `;
      return card;
    }

    // جلب صور وفيديوهات الإيفنت
    async function fetchEventMedia() {
      mainGallery.innerHTML = '<div class="empty-state">Updating album... ⏳</div>';
      try {
        // Fetch by tag (eventName)
        const [imagesRes, videosRes] = await Promise.allSettled([
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${eventName}.json`),
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/${eventName}.json`)
        ]);

        let items = [];

        if (imagesRes.status === 'fulfilled' && imagesRes.value.ok) {
          const imgData = await imagesRes.value.json();
          imgData.resources.forEach(r => {
            items.push({
              url: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${r.public_id}.${r.format}`,
              type: 'image',
              created_at: new Date(r.created_at)
            });
          });
        }

        if (videosRes.status === 'fulfilled' && videosRes.value.ok) {
          const vidData = await videosRes.value.json();
          vidData.resources.forEach(r => {
            items.push({
              url: `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/${r.public_id}.${r.format}`,
              type: 'video',
              created_at: new Date(r.created_at)
            });
          });
        }

        items.sort((a, b) => b.created_at - a.created_at);

        mainGallery.innerHTML = '';
        if (items.length === 0) {
          mainGallery.innerHTML = '<div class="empty-state">No photos yet! Be the first to snap a moment. 📸</div>';
        } else {
          items.forEach(item => {
            mainGallery.appendChild(createMediaCard(item.url, item.type));
          });
        }
      } catch (e) {
        console.error(e);
        mainGallery.innerHTML = '<div class="empty-state">Snap a photo to start the album! 📸</div>';
      }
    }

    // Upload function
    async function handleUpload(file, resourceType) {
      if (!file) return;

      setStatus("Uploading to album... ⏳", "loading");

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", eventName);
      formData.append("asset_folder", eventName);
      formData.append("tags", eventName); // مهم جداً عشان يربطها بألبوم الإيفنت

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.secure_url) {
          setStatus("✅ Uploaded successfully!", "success");
          // Add newly uploaded item at top of gallery immediately
          const newCard = createMediaCard(data.secure_url, resourceType);
          const emptyState = mainGallery.querySelector('.empty-state');
          if (emptyState) emptyState.remove();
          mainGallery.prepend(newCard);
        } else {
          setStatus("❌ Upload failed. Please try again.", "error");
        }
      } catch (err) {
        console.error(err);
        setStatus("❌ Connection error. Check internet.", "error");
      }
    }

    photoInput.addEventListener('change', (e) => handleUpload(e.target.files[0], 'image'));
    videoInput.addEventListener('change', (e) => handleUpload(e.target.files[0], 'video'));

    // Initial fetch on page load
    fetchEventMedia();
  </script>

</body>
</html>
