<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Event Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Event Badge */
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* Hero Upload Card */
    .action-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .action-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .action-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .upload-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      color: #fff;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-photo {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-video {
      background: linear-gradient(135deg, #ec4899, #d946ef);
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
    }

    .upload-btn:active {
      transform: scale(0.97);
    }

    .upload-btn span.icon {
      font-size: 24px;
    }

    /* Status Messages */
    .status-alert {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-loading { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-success { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Gallery Tabs Section */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .gallery-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Custom Tabs */
    .tab-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* Media Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .media-preview {
      position: relative;
      width: 100%;
      height: 150px;
      background: #000;
      cursor: pointer;
    }

    .media-preview img, .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      font-size: 28px;
    }

    .save-btn {
      padding: 10px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .save-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    /* Lightbox Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content-wrapper {
      max-width: 100%;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content-wrapper img, .modal-content-wrapper video {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Event Card -->
    <div class="action-card">
      <div class="header-badge" id="eventBadge">✨ General Event</div>
      <h1>Capture the Moment</h1>
      <p>Take live photos or record short videos to add them straight to the couple's live album!</p>

      <div class="button-group">
        <label for="photoInput" class="upload-btn btn-photo">
          <span class="icon">📸</span>
          <span>Take Photo</span>
        </label>
        <label for="videoInput" class="upload-btn btn-video">
          <span class="icon">🎥</span>
          <span>Record Video</span>
        </label>
      </div>

      <input type="file" id="photoInput" accept="image/*" capture="environment">
      <input type="file" id="videoInput" accept="video/*" capture="environment">

      <div id="statusBox" class="status-alert"></div>
    </div>

    <!-- Live Album Section -->
    <div class="gallery-header">
      <div class="gallery-title">🎉 Live Album</div>
      <button class="btn-refresh" id="refreshBtn">🔄 Refresh</button>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="photosTab" onclick="switchTab('photos')">📸 Photos (<span id="photoCount">0</span>)</button>
      <button class="tab-btn" id="videosTab" onclick="switchTab('videos')">🎥 Videos (<span id="videoCount">0</span>)</button>
    </div>

    <!-- Media Grids -->
    <div class="media-grid" id="photosGrid">
      <div class="empty-state">No photos yet! Be the first to snap a shot. 📸</div>
    </div>

    <div class="media-grid" id="videosGrid" style="display: none;">
      <div class="empty-state">No videos yet! Record a moment now. 🎥</div>
    </div>
  </div>

  <!-- Modal Preview -->
  <div class="modal-overlay" id="mediaModal" onclick="closeModal(event)">
    <button class="modal-close-btn" onclick="closeModal()">✕</button>
    <div class="modal-content-wrapper" id="modalTarget"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawEvent = urlParams.get('event');
    const eventName = rawEvent ? rawEvent.trim().replace(/\s+/g, '_') : 'General_Event';
    
    document.getElementById('eventBadge').innerText = "✨ " + eventName.replace(/_/g, ' ');

    const CLOUD_NAME = "qwmaeyjl";
    const UPLOAD_PRESET = "events_upload";

    const photoInput = document.getElementById('photoInput');
    const videoInput = document.getElementById('videoInput');
    const statusBox = document.getElementById('statusBox');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentTab = 'photos';
    let photoItems = [];
    let videoItems = [];

    function setStatus(msg, type) {
      if (!statusBox) return;
      statusBox.className = `status-alert status-${type}`;
      statusBox.innerText = msg;
      statusBox.style.display = "block";
    }

    async function downloadFile(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    function openModal(url, type) {
      const modal = document.getElementById('mediaModal');
      const target = document.getElementById('modalTarget');
      if (type === 'image') {
        target.innerHTML = `<img src="${url}" alt="Full View">`;
      } else {
        target.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
      }
      modal.style.display = 'flex';
    }

    function closeModal(e) {
      if (!e || e.target.id === 'mediaModal' || e.target.className === 'modal-close-btn') {
        const modal = document.getElementById('mediaModal');
        const target = document.getElementById('modalTarget');
        target.innerHTML = '';
        modal.style.display = 'none';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const photosTab = document.getElementById('photosTab');
      const videosTab = document.getElementById('videosTab');
      const photosGrid = document.getElementById('photosGrid');
      const videosGrid = document.getElementById('videosGrid');

      if (tab === 'photos') {
        photosTab.classList.add('active');
        videosTab.classList.remove('active');
        photosGrid.style.display = 'grid';
        videosGrid.style.display = 'none';
      } else {
        videosTab.classList.add('active');
        photosTab.classList.remove('active');
        photosGrid.style.display = 'none';
        videosGrid.style.display = 'grid';
      }
    }

    function createMediaCard(url, type) {
      const card = document.createElement('div');
      card.className = 'media-card';
      const filename = `${eventName}_${Date.now()}.${type === 'image' ? 'jpg' : 'mp4'}`;
      
      const mediaHtml = type === 'image' 
        ? `<img src="${url}" loading="lazy" alt="Event Moment">`
        : `<video src="${url}" playsinline muted></video><div class="video-play-overlay">▶️</div>`;

      card.innerHTML = `
        <div class="media-preview" onclick="openModal('${url}', '${type}')">
          ${mediaHtml}
        </div>
        <button class="save-btn" onclick="downloadFile('${url}', '${filename}')">
          ⬇️ Save ${type === 'image' ? 'Photo' : 'Video'}
        </button>
      `;
      return card;
    }

    async function fetchEventMedia() {
      const cacheBuster = Date.now();
      setStatus("Refreshing gallery... 🔄", "loading");

      try {
        const [imagesRes, videosRes] = await Promise.allSettled([
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${eventName}.json?cb=${cacheBuster}`),
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/${eventName}.json?cb=${cacheBuster}`)
        ]);

        photoItems = [];
        videoItems = [];

        if (imagesRes.status === 'fulfilled' && imagesRes.value.ok) {
          const imgData = await imagesRes.value.json();
          if (imgData.resources) {
            imgData.resources.forEach(r => {
              photoItems.push({
                url: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${r.version}/${r.public_id}.${r.format}`,
                created_at: new Date(r.created_at)
              });
            });
          }
        }

        if (videosRes.status === 'fulfilled' && videosRes.value.ok) {
          const vidData = await videosRes.value.json();
          if (vidData.resources) {
            vidData.resources.forEach(r => {
              videoItems.push({
                url: `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${r.version}/${r.public_id}.${r.format}`,
                created_at: new Date(r.created_at)
              });
            });
          }
        }

        photoItems.sort((a, b) => b.created_at - a.created_at);
        videoItems.sort((a, b) => b.created_at - a.created_at);

        document.getElementById('photoCount').innerText = photoItems.length;
        document.getElementById('videoCount').innerText = videoItems.length;

        // Render Photos
        const photosGrid = document.getElementById('photosGrid');
        photosGrid.innerHTML = '';
        if (photoItems.length === 0) {
          photosGrid.innerHTML = '<div class="empty-state">No photos yet! Be the first to snap a shot. 📸</div>';
        } else {
          photoItems.forEach(item => photosGrid.appendChild(createMediaCard(item.url, 'image')));
        }

        // Render Videos
        const videosGrid = document.getElementById('videosGrid');
        videosGrid.innerHTML = '';
        if (videoItems.length === 0) {
          videosGrid.innerHTML = '<div class="empty-state">No videos yet! Record a moment now. 🎥</div>';
        } else {
          videoItems.forEach(item => videosGrid.appendChild(createMediaCard(item.url, 'video')));
        }

        statusBox.style.display = "none";
      } catch (e) {
        console.error(e);
        statusBox.style.display = "none";
      }
    }

    async function handleUpload(file, resourceType) {
      if (!file) return;

      setStatus(`Uploading ${resourceType}... ⏳`, "loading");

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", eventName);
      formData.append("tags", eventName);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.secure_url) {
          setStatus("✅ Uploaded successfully!", "success");
          setTimeout(() => {
            fetchEventMedia();
            if (resourceType === 'video') switchTab('videos');
            else switchTab('photos');
          }, 1200);
        } else {
          setStatus("❌ Upload failed. Please try again.", "error");
        }
      } catch (err) {
        console.error(err);
        setStatus("❌ Connection error. Check internet.", "error");
      }
    }

    if (photoInput) photoInput.addEventListener('change', (e) => handleUpload(e.target.files[0], 'image'));
    if (videoInput) videoInput.addEventListener('change', (e) => handleUpload(e.target.files[0], 'video'));
    if (refreshBtn) refreshBtn.addEventListener('click', fetchEventMedia);

    fetchEventMedia();
  </script>
</body>
</html>
