<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event QR & Gallery Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .panel {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    p.desc {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 14px; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 11px 13px;
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      border-color: #38bdf8;
    }

    .features-box {
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .feature-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .color-item {
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }
    .btn-create:active { transform: scale(0.98); }

    .result {
      display: none;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #26334d;
      text-align: center;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 14px;
    }
    #qrCanvas { display: block; margin: 0 auto; }
    .link-display {
      background: #090d16;
      border: 1px solid #26334d;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 14px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .action-btn {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #38bdf8;
    }
    .action-btn.primary { background: #38bdf8; color: #000; }
    .action-btn.secondary { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
    .action-btn.download-qr {
      grid-column: span 2;
      background: #10b981;
      border-color: #10b981;
      color: #000;
      font-size: 14px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Event Studio</h1>
    <p class="desc">Generate live event albums & download print-ready QR codes</p>

    <div class="row-2">
      <div class="form-group">
        <label>Event Type</label>
        <select id="evType">
          <option value="Wedding">💍 Wedding</option>
          <option value="Engagement">💎 Engagement</option>
          <option value="Birthday">🎂 Birthday</option>
          <option value="Real Estate">🏢 Real Estate</option>
          <option value="Corporate">💼 Corporate</option>
          <option value="Concert">🎵 Concert</option>
          <option value="Graduation">🎓 Graduation</option>
        </select>
      </div>

      <div class="form-group">
        <label>Event Date (Optional)</label>
        <input type="date" id="evDate" />
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Event Name / Title</label>
        <input type="text" id="evTitle" placeholder="e.g. Omar & Nour" value="Omar & Nour" />
      </div>

      <div class="form-group">
        <label>Venue / Location (Optional)</label>
        <input type="text" id="evVenue" placeholder="e.g. Dusit Thani" />
      </div>
    </div>

    <div class="form-group">
      <label>Package Features</label>
      <div class="features-box">
        <label class="feature-item">
          <input type="checkbox" id="featVoice" checked />
          <span>🎙️ Voice Guestbook</span>
        </label>
        <label class="feature-item">
          <input type="checkbox" id="featVideo" checked />
          <span>🎥 Video Wishes</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Subtitle / Note</label>
      <input type="text" id="evSub" placeholder="e.g. Share your moments" value="Share your live moments with us" />
    </div>

    <div class="form-group">
      <label>Color Palette</label>
      <div class="color-grid">
        <div class="color-item">
          <input type="color" id="primaryColor" value="#4a6342" onchange="syncHex('primaryColor', 'primaryHex')" />
          <div>
            <div style="font-size: 10px; color:#94a3b8;">Primary Color</div>
            <input type="text" id="primaryHex" value="#4a6342" style="padding:2px 4px; font-size:11px;" onchange="syncColor('primaryHex', 'primaryColor')" />
          </div>
        </div>
        <div class="color-item">
          <input type="color" id="bgColor" value="#f8faf7" onchange="syncHex('bgColor', 'bgHex')" />
          <div>
            <div style="font-size: 10px; color:#94a3b8;">Background</div>
            <input type="text" id="bgHex" value="#f8faf7" style="padding:2px 4px; font-size:11px;" onchange="syncColor('bgHex', 'bgColor')" />
          </div>
        </div>
      </div>
    </div>

    <button class="btn-create" type="button" onclick="generateSystem()">⚡ Generate Live QR & Link</button>

    <div class="result" id="resultArea">
      <div class="qr-box">
        <canvas id="qrCanvas"></canvas>
      </div>
      <div class="link-display" id="generatedLink"></div>
      
      <div class="btn-grid">
        <button class="action-btn download-qr" type="button" onclick="downloadQRCodeImage()">📥 Download QR Image (PNG)</button>
        <a href="#" id="openLinkBtn" target="_blank" class="action-btn primary">🚀 Open Album</a>
        <button type="button" onclick="copyGeneratedLink()" class="action-btn secondary">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    function syncHex(colId, hexId) {
      document.getElementById(hexId).value = document.getElementById(colId).value;
    }
    function syncColor(hexId, colId) {
      const val = document.getElementById(hexId).value;
      if (val.startsWith('#') && (val.length === 7 || val.length === 4)) {
        document.getElementById(colId).value = val;
      }
    }

    function getUniqueCode() {
      return Math.random().toString(36).substring(2, 6);
    }

    let currentEventSlug = 'qr_event';

    function generateSystem() {
      try {
        const type = document.getElementById('evType').value;
        const title = document.getElementById('evTitle').value.trim() || 'Live Event';
        const venue = document.getElementById('evVenue').value.trim();
        const dateVal = document.getElementById('evDate').value;
        const sub = document.getElementById('evSub').value.trim() || 'Share your live moments with us';
        
        const allowVoice = document.getElementById('featVoice').checked;
        const allowVideo = document.getElementById('featVideo').checked;

        let pCol = document.getElementById('primaryHex').value.replace('#', '').trim() || '4a6342';
        let bCol = document.getElementById('bgHex').value.replace('#', '').trim() || 'f8faf7';

        // توليد التاج التلقائي الخاص بالفرح
        let cleanTagParts = [title.replace(/\s+/g, '')];
        if (venue) cleanTagParts.push(venue.replace(/\s+/g, ''));
        if (dateVal) cleanTagParts.push(dateVal.replace(/-/g, ''));
        cleanTagParts.push(getUniqueCode());

        const uniqueTag = cleanTagParts.join('_').replace(/[^a-zA-Z0-9_]/g, '');
        currentEventSlug = uniqueTag;

        const hostUrl = "https://marwanselim360-web.github.io/events-app";
        const fullUrl = `${hostUrl}/index.html?event=${uniqueTag}&title=${encodeURIComponent(title)}&type=${encodeURIComponent(type)}&sub=${encodeURIComponent(sub)}&voice=${allowVoice}&video=${allowVideo}&p=${pCol}&bg=${bCol}`;

        document.getElementById('generatedLink').innerText = fullUrl;
        document.getElementById('openLinkBtn').href = fullUrl;

        new QRious({
          element: document.getElementById('qrCanvas'),
          value: fullUrl,
          size: 240,
          level: 'H'
        });

        document.getElementById('resultArea').style.display = 'block';
      } catch (e) {
        alert("Error generating QR: " + e.message);
      }
    }

    function downloadQRCodeImage() {
      const canvas = document.getElementById('qrCanvas');
      if (!canvas) {
        alert("Please generate QR first!");
        return;
      }
      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `QR_${currentEventSlug}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyGeneratedLink() {
      const text = document.getElementById('generatedLink').innerText;
      navigator.clipboard.writeText(text);
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
