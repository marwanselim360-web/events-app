<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event QR & Gallery Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .panel {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    p.desc {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 14px; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="date"], input[type="number"], select {
      width: 100%;
      padding: 11px 13px;
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus {
      border-color: #38bdf8;
    }

    .upload-avatar-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-file-avatar {
      background: #26334d;
      color: #38bdf8;
      border: 1px dashed #38bdf8;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-file-avatar:hover { background: rgba(56, 189, 248, 0.1); }

    .features-box {
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .feature-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .color-item {
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }
    .btn-create:active { transform: scale(0.98); }

    .result {
      display: none;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #26334d;
      text-align: center;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 14px;
    }
    #qrCanvas { display: block; margin: 0 auto; }
    .link-display {
      background: #090d16;
      border: 1px solid #26334d;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 14px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .action-btn {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #38bdf8;
    }
    .action-btn.primary { background: #38bdf8; color: #000; }
    .action-btn.secondary { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
    .action-btn.download-qr {
      grid-column: span 2;
      background: #10b981;
      border-color: #10b981;
      color: #000;
      font-size: 14px;
      font-weight: 800;
    }

    /* Cropper Modal Styles */
    .crop-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .crop-modal.active { display: flex; }
    .crop-container {
      background: #131b2e;
      border: 1px solid #26334d;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .crop-canvas-wrap {
      width: 250px;
      height: 250px;
      margin: 0 auto 16px;
      border-radius: 28px;
      overflow: hidden;
      border: 2px dashed #38bdf8;
      position: relative;
      background: #000;
      cursor: grab;
    }
    .crop-canvas-wrap:active { cursor: grabbing; }
    #cropCanvas {
      display: block;
      touch-action: none;
    }
    .zoom-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .zoom-control input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Event Studio</h1>
    <p class="desc">Generate live event albums & download print-ready QR codes</p>

    <div class="row-2">
      <div class="form-group">
        <label>Event Type</label>
        <select id="evType">
          <option value="Wedding">💍 Wedding</option>
          <option value="Engagement">💎 Engagement</option>
          <option value="Birthday">🎂 Birthday</option>
          <option value="Real Estate">🏢 Real Estate</option>
          <option value="Corporate">💼 Corporate</option>
          <option value="Concert">🎵 Concert</option>
          <option value="Graduation">🎓 Graduation</option>
        </select>
      </div>

      <div class="form-group">
        <label>Event Date (Optional)</label>
        <input type="date" id="evDate" />
      </div>
    </div>

    <div class="form-group">
      <label>Display Date Text (e.g. 11.9.2026 - Optional)</label>
      <input type="text" id="evDateText" placeholder="Leave empty to hide date" value="11.9.2026" />
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Photos Limit</label>
        <select id="evPhotoLimitSelect" onchange="togglePhotoLimit()">
          <option value="unlimited">♾️ Unlimited Photos</option>
          <option value="custom">🔢 Custom Limit</option>
        </select>
        <input type="number" id="evPhotoLimitVal" placeholder="Max photos (e.g. 500)" value="500" style="display: none; margin-top: 6px;" />
      </div>

      <div class="form-group">
        <label>Videos Limit</label>
        <select id="evVideoLimitSelect" onchange="toggleVideoLimit()">
          <option value="unlimited">♾️ Unlimited Videos</option>
          <option value="custom">🔢 Custom Limit</option>
        </select>
        <input type="number" id="evVideoLimitVal" placeholder="Max videos (e.g. 50)" value="50" style="display: none; margin-top: 6px;" />
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Event Name / Title</label>
        <input type="text" id="evTitle" placeholder="e.g. Moataz & Rania" value="Moataz & Rania" />
      </div>

      <div class="form-group">
        <label>Venue / Location (Optional)</label>
        <input type="text" id="evVenue" placeholder="e.g. Dusit Thani" />
      </div>
    </div>

    <div class="form-group" style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid #26334d;">
      <label style="color: #38bdf8;">Top Header Display (Above Title)</label>
      <select id="headerMode" onchange="handleHeaderModeChange()">
        <option value="ring">💍 Default Ring / Event Icon</option>
        <option value="none">🚫 None (Hide icon completely)</option>
        <option value="photo">🖼️ Portrait Squircle Photo</option>
      </select>
      
      <div id="avatarUploadWrap" style="display: none; margin-top: 10px;">
        <div class="upload-avatar-row">
          <input type="text" id="evCoupleImg" placeholder="Upload portrait photo or paste URL" />
          <button type="button" class="btn-file-avatar" id="btnUploadAvatar" onclick="document.getElementById('avatarPicker').click()">
            📁 Upload & Adjust
          </button>
        </div>
        <input type="file" id="avatarPicker" accept="image/*" style="display: none;" onchange="openCropperModal(event)" />
      </div>
    </div>

    <div class="form-group" style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid #26334d;">
      <label style="color: #38bdf8;">2. Page Background Pattern/Image (Optional)</label>
      <div class="upload-avatar-row">
        <input type="text" id="evBgImg" placeholder="Leave empty for solid color, or upload pattern" />
        <button type="button" class="btn-file-avatar" id="btnUploadBg" onclick="document.getElementById('bgPicker').click()">
          🖼️ Upload BG
        </button>
      </div>
      <input type="file" id="bgPicker" accept="image/*" style="display: none;" onchange="handleGenericUpload(event, 'evBgImg', 'btnUploadBg', 'page_backgrounds')" />
    </div>

    <div class="form-group">
      <label>Package Features</label>
      <div class="features-box">
        <label class="feature-item">
          <input type="checkbox" id="featVoice" checked />
          <span>🎙️ Voice Guestbook</span>
        </label>
        <label class="feature-item">
          <input type="checkbox" id="featVideo" checked />
          <span>🤳 Video Wishes</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Subtitle / Note</label>
      <input type="text" id="evSub" placeholder="e.g. Share your moments" value="Share your live moments with us" />
    </div>

    <div class="color-grid">
      <div class="color-item">
        <input type="color" id="primaryColor" value="#4a6342" onchange="syncHex('primaryColor', 'primaryHex')" />
        <div>
          <div style="font-size: 10px; color:#94a3b8;">Primary Color</div>
          <input type="text" id="primaryHex" value="#4a6342" style="padding:2px 4px; font-size:11px;" onchange="syncColor('primaryHex', 'primaryColor')" />
        </div>
      </div>
      <div class="color-item">
        <input type="color" id="bgColor" value="#f8faf7" onchange="syncHex('bgColor', 'bgHex')" />
        <div>
          <div style="font-size: 10px; color:#94a3b8;">Background Color</div>
          <input type="text" id="bgHex" value="#f8faf7" style="padding:2px 4px; font-size:11px;" onchange="syncColor('bgHex', 'bgColor')" />
        </div>
      </div>
    </div>

    <button class="btn-create" type="button" onclick="generateSystem()">⚡ Generate Live QR & Link</button>

    <div class="result" id="resultArea">
      <div class="qr-box">
        <canvas id="qrCanvas"></canvas>
      </div>
      <div class="link-display" id="generatedLink"></div>
      
      <div class="btn-grid">
        <button class="action-btn download-qr" type="button" onclick="downloadQRCodeImage()">📥 Download QR Image (PNG)</button>
        <a href="#" id="openLinkBtn" target="_blank" class="action-btn primary">🚀 Open Album</a>
        <button type="button" onclick="copyGeneratedLink()" class="action-btn secondary">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <!-- Cropper Modal -->
  <div class="crop-modal" id="cropModal">
    <div class="crop-container">
      <h3 style="color:#38bdf8; margin-bottom: 12px; font-size:16px;">Adjust Portrait Photo</h3>
      <div class="crop-canvas-wrap" id="cropWrap">
        <canvas id="cropCanvas" width="250" height="250"></canvas>
      </div>
      <div class="zoom-control">
        <span style="font-size:11px; color:#94a3b8;">Zoom:</span>
        <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" oninput="updateZoom(this.value)">
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="action-btn secondary" style="flex:1;" onclick="closeCropperModal()">Cancel</button>
        <button type="button" class="action-btn primary" style="flex:1;" onclick="confirmCrop()">Crop & Save</button>
      </div>
    </div>
  </div>

  <script>
    const API = "https://nameless-king-3d15.marwanselim360.workers.dev";
    const FIXED_CHAT_ID = "-1003837109142";

    function handleHeaderModeChange() {
      const mode = document.getElementById('headerMode').value;
      document.getElementById('avatarUploadWrap').style.display = mode === 'photo' ? 'block' : 'none';
    }

    function togglePhotoLimit() {
      const mode = document.getElementById('evPhotoLimitSelect').value;
      document.getElementById('evPhotoLimitVal').style.display = mode === 'custom' ? 'block' : 'none';
    }

    function toggleVideoLimit() {
      const mode = document.getElementById('evVideoLimitSelect').value;
      document.getElementById('evVideoLimitVal').style.display = mode === 'custom' ? 'block' : 'none';
    }

    function syncHex(colId, hexId) {
      document.getElementById(hexId).value = document.getElementById(colId).value;
    }
    function syncColor(hexId, colId) {
      const val = document.getElementById(hexId).value;
      if (val.startsWith('#') && (val.length === 7 || val.length === 4)) {
        document.getElementById(colId).value = val;
      }
    }

    function getUniqueCode() {
      return Math.random().toString(36).substring(2, 6);
    }

    // --- Interactive Zoom & Crop Logic ---
    let cropImageObj = null;
    let imgX = 0, imgY = 0, imgScale = 1;
    let isDragging = false;
    let startX = 0, startY = 0;
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');

    function openCropperModal(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        cropImageObj = new Image();
        cropImageObj.onload = function() {
          // Reset positioning
          imgScale = Math.max(250 / cropImageObj.width, 250 / cropImageObj.height);
          document.getElementById('zoomRange').value = imgScale;
          imgX = (250 - cropImageObj.width * imgScale) / 2;
          imgY = (250 - cropImageObj.height * imgScale) / 2;
          
          drawCropCanvas();
          document.getElementById('cropModal').classList.add('active');
        };
        cropImageObj.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = ''; // reset input
    }

    function closeCropperModal() {
      document.getElementById('cropModal').classList.remove('active');
    }

    function updateZoom(val) {
      if (!cropImageObj) return;
      const oldScale = imgScale;
      imgScale = parseFloat(val);
      // Zoom towards center
      imgX = 125 - (125 - imgX) * (imgScale / oldScale);
      imgY = 125 - (125 - imgY) * (imgScale / oldScale);
      drawCropCanvas();
    }

    function drawCropCanvas() {
      if (!cropImageObj) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(cropImageObj, imgX, imgY, cropImageObj.width * imgScale, cropImageObj.height * imgScale);
    }

    // Mouse / Touch Dragging Events for Crop
    const wrap = document.getElementById('cropWrap');
    wrap.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - imgX;
      startY = e.clientY - imgY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      imgX = e.clientX - startX;
      imgY = e.clientY - startY;
      drawCropCanvas();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    wrap.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX - imgX;
      startY = e.touches[0].clientY - imgY;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      imgX = e.touches[0].clientX - startX;
      imgY = e.touches[0].clientY - startY;
      drawCropCanvas();
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    async function confirmCrop() {
      const uploadBtn = document.getElementById('btnUploadAvatar');
      uploadBtn.innerText = "⏳ Uploading...";
      uploadBtn.disabled = true;

      canvas.toBlob(async (blob) => {
        const file = new File([blob], "avatar_cropped.jpg", { type: "image/jpeg" });
        const fd = new FormData();
        fd.append("file", file, "avatar_cropped.jpg");
        fd.append("chat_id", FIXED_CHAT_ID);
        fd.append("event", "couple_avatars");
        fd.append("type", "photo");

        try {
          const res = await fetch(API, { method: "POST", body: fd });
          const json = await res.json();
          if (json.ok && json.item && json.item.url) {
            document.getElementById('evCoupleImg').value = json.item.url;
            uploadBtn.innerText = "✓ Uploaded";
            closeCropperModal();
          } else {
            alert("Failed to upload cropped image.");
            uploadBtn.innerText = "📁 Upload & Adjust";
          }
        } catch (err) {
          alert("Upload error: " + err.message);
          uploadBtn.innerText = "📁 Upload & Adjust";
        } finally {
          uploadBtn.disabled = false;
        }
      }, 'image/jpeg', 0.9);
    }

    async function handleGenericUpload(event, targetInputId, btnId, eventTag) {
      const file = event.target.files[0];
      if (!file) return;

      const uploadBtn = document.getElementById(btnId);
      const originalText = uploadBtn.innerText;
      uploadBtn.innerText = "⏳ Uploading...";
      uploadBtn.disabled = true;

      const fd = new FormData();
      fd.append("file", file, file.name || "image.jpg");
      fd.append("chat_id", FIXED_CHAT_ID);
      fd.append("event", eventTag);
      fd.append("type", "photo");

      try {
        const res = await fetch(API, { method: "POST", body: fd });
        const json = await res.json();
        if (json.ok && json.item && json.item.url) {
          document.getElementById(targetInputId).value = json.item.url;
          uploadBtn.innerText = "✓ Uploaded";
        } else {
          alert("Failed to upload image.");
          uploadBtn.innerText = originalText;
        }
      } catch (err) {
        alert("Upload error: " + err.message);
        uploadBtn.innerText = originalText;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    let currentEventSlug = 'qr_event';
    let currentGeneratedUrl = '';

    function generateSystem() {
      try {
        const type = document.getElementById('evType').value;
        const title = document.getElementById('evTitle').value.trim() || 'Live Event';
        const venue = document.getElementById('evVenue').value.trim();
        const dateVal = document.getElementById('evDate').value;
        const dateTextVal = document.getElementById('evDateText').value.trim();
        const sub = document.getElementById('evSub').value.trim() || 'Share your live moments with us';
        
        const headerMode = document.getElementById('headerMode').value;
        const coupleImg = document.getElementById('evCoupleImg').value.trim();
        const bgImg = document.getElementById('evBgImg').value.trim();
        
        const photoLimitMode = document.getElementById('evPhotoLimitSelect').value;
        const photoLimitVal = photoLimitMode === 'custom' ? document.getElementById('evPhotoLimitVal').value : 'unlimited';

        const videoLimitMode = document.getElementById('evVideoLimitSelect').value;
        const videoLimitVal = videoLimitMode === 'custom' ? document.getElementById('evVideoLimitVal').value : 'unlimited';

        const allowVoice = document.getElementById('featVoice').checked;
        const allowVideo = document.getElementById('featVideo').checked;

        let pCol = document.getElementById('primaryHex').value.replace('#', '').trim() || '4a6342';
        let bCol = document.getElementById('bgHex').value.replace('#', '').trim() || 'f8faf7';

        let vwCol = pCol; 
        let voCol = pCol; 

        let cleanTagParts = [title.replace(/\s+/g, '')];
        if (venue) cleanTagParts.push(venue.replace(/\s+/g, ''));
        if (dateVal) cleanTagParts.push(dateVal.replace(/-/g, ''));
        cleanTagParts.push(getUniqueCode());

        const uniqueTag = cleanTagParts.join('_').replace(/[^a-zA-Z0-9_]/g, '');
        currentEventSlug = uniqueTag;

        const hostUrl = "https://marwanselim360-web.github.io/events-app";
        let fullUrl = `${hostUrl}/index.html?event=${uniqueTag}&title=${encodeURIComponent(title)}&type=${encodeURIComponent(type)}&sub=${encodeURIComponent(sub)}&plimit=${photoLimitVal}&vlimit=${videoLimitVal}&voice=${allowVoice}&video=${allowVideo}&p=${pCol}&bg=${bCol}&vwc=${vwCol}&voc=${voCol}`;
        
        if (dateTextVal !== '') {
          fullUrl += `&date=${encodeURIComponent(dateTextVal)}`;
        }

        if (headerMode === 'none') {
          fullUrl += `&h_mode=none`;
        } else if (headerMode === 'photo' && coupleImg) {
          fullUrl += `&img=${encodeURIComponent(coupleImg)}`;
        }

        if (bgImg) {
          fullUrl += `&bg_img=${encodeURIComponent(bgImg)}`;
        }

        currentGeneratedUrl = fullUrl;

        document.getElementById('generatedLink').innerText = fullUrl;
        document.getElementById('openLinkBtn').href = fullUrl;

        new QRious({
          element: document.getElementById('qrCanvas'),
          value: fullUrl,
          size: 300,
          level: 'L'
        });

        document.getElementById('resultArea').style.display = 'block';
      } catch (e) {
        alert("Error generating QR: " + e.message);
      }
    }

    function downloadQRCodeImage() {
      if (!currentGeneratedUrl) {
        alert("Please generate QR first!");
        return;
      }

      const exportCanvas = document.createElement('canvas');
      new QRious({
        element: exportCanvas,
        value: currentGeneratedUrl,
        size: 1200,
        level: ''
      });

      const dataUrl = exportCanvas.toDataURL("image/png");
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `QR_${currentEventSlug}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyGeneratedLink() {
      const text = document.getElementById('generatedLink').innerText;
      navigator.clipboard.writeText(text);
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
