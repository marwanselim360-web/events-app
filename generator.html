<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event QR & Gallery Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .panel {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    p.desc {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #38bdf8;
    }
    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .color-item {
      background: #090d16;
      border: 1px solid #26334d;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .btn-create {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }
    .btn-create:active { transform: scale(0.98); }

    .result {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #26334d;
      text-align: center;
    }
    .qr-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 14px;
    }
    .link-display {
      background: #090d16;
      border: 1px solid #26334d;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 14px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #38bdf8;
    }
    .action-btn.primary {
      background: #38bdf8;
      color: #000;
    }
    .action-btn.secondary {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Event Studio</h1>
    <p class="desc">Generate live dynamic event galleries & instant QR codes</p>

    <div class="form-group">
      <label>Event Category / Type</label>
      <select id="evType">
        <option value="Wedding">💍 Wedding</option>
        <option value="Engagement">💍 Engagement</option>
        <option value="Birthday">🎂 Birthday Party</option>
        <option value="Real Estate Launch">🏢 Real Estate Launch</option>
        <option value="Corporate Event">💼 Corporate / Conference</option>
        <option value="Concert">🎵 Concert / Music Festival</option>
        <option value="Graduation">🎓 Graduation Ceremony</option>
        <option value="VIP Gathering">⭐ VIP Exclusive Event</option>
      </select>
    </div>

    <div class="form-group">
      <label>Event Name / Title</label>
      <input type="text" id="evTitle" placeholder="e.g. Omar & Nour" value="Omar & Nour" />
    </div>

    <div class="form-group">
      <label>Subtitle / Note (Optional)</label>
      <input type="text" id="evSub" placeholder="e.g. Share your live memories" value="Share your live moments with us" />
    </div>

    <div class="form-group">
      <label>Color Customization</label>
      <div class="color-grid">
        <div class="color-item">
          <input type="color" id="primaryColor" value="#4a6342" onchange="syncHex('primaryColor', 'primaryHex')" />
          <div>
            <div style="font-size: 11px; color:#94a3b8;">Primary Color</div>
            <input type="text" id="primaryHex" value="#4a6342" style="padding:4px; font-size:12px;" onchange="syncColor('primaryHex', 'primaryColor')" />
          </div>
        </div>
        <div class="color-item">
          <input type="color" id="bgColor" value="#f8faf7" onchange="syncHex('bgColor', 'bgHex')" />
          <div>
            <div style="font-size: 11px; color:#94a3b8;">Background Color</div>
            <input type="text" id="bgHex" value="#f8faf7" style="padding:4px; font-size:12px;" onchange="syncColor('bgHex', 'bgColor')" />
          </div>
        </div>
      </div>
    </div>

    <button class="btn-create" onclick="generateSystem()">⚡ Generate Live QR & Link</button>

    <div class="result" id="resultArea">
      <div class="qr-box" id="qrcode"></div>
      <div class="link-display" id="generatedLink"></div>
      <div class="btn-row">
        <a href="#" id="openLinkBtn" target="_blank" class="action-btn primary">🚀 Open Album</a>
        <button onclick="copyGeneratedLink()" class="action-btn secondary">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    function syncHex(colId, hexId) {
      document.getElementById(hexId).value = document.getElementById(colId).value;
    }
    function syncColor(hexId, colId) {
      const val = document.getElementById(hexId).value;
      if (val.startsWith('#') && (val.length === 7 || val.length === 4)) {
        document.getElementById(colId).value = val;
      }
    }

    function generateSystem() {
      const type = document.getElementById('evType').value;
      const title = document.getElementById('evTitle').value.trim() || 'Live Event';
      const sub = document.getElementById('evSub').value.trim() || 'Live Shared Album';
      
      let pCol = document.getElementById('primaryHex').value.replace('#', '').trim();
      let bCol = document.getElementById('bgHex').value.replace('#', '').trim();
      if (!pCol) pCol = '4a6342';
      if (!bCol) bCol = 'f8faf7';

      const cleanTag = (title + '_' + type).replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');

      // الرابط الرسمي الدائم على GitHub Pages ليعمل على أي موبايل
      const hostUrl = "https://marwanselim360-web.github.io/events-app";
      const fullUrl = `${hostUrl}/index.html?event=${cleanTag}&title=${encodeURIComponent(title)}&type=${encodeURIComponent(type)}&sub=${encodeURIComponent(sub)}&p=${pCol}&bg=${bCol}`;

      document.getElementById('generatedLink').innerText = fullUrl;
      document.getElementById('openLinkBtn').href = fullUrl;

      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';
      new QRCode(qrBox, {
        text: fullUrl,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('resultArea').style.display = 'block';
    }
  </script>
</body>
</html>
