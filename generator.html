<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event QR & Theme Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.sub {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #38bdf8;
    }
    .color-pickers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .color-field {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 14px;
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-generate:hover { opacity: 0.9; }

    .result-section {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #334155;
      text-align: center;
    }
    .qr-wrapper {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .link-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      font-size: 12px;
      word-break: break-all;
      color: #38bdf8;
      margin-bottom: 12px;
    }
    .action-links {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }
    .btn-action.primary {
      background: #38bdf8;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Event Generator</h1>
    <p class="sub">Create custom QR codes & live album links instantly</p>

    <div class="form-group">
      <label>Wedding / Event Name</label>
      <input type="text" id="evName" placeholder="e.g. Omar & Nour" value="Omar & Nour" />
    </div>

    <div class="form-group">
      <label>Preset Aesthetic Themes</label>
      <select id="presetSelect" onchange="applyPreset()">
        <option value="custom">Custom Colors (Pick Below)</option>
        <option value="olive_gold" selected>🌿 Olive Green & Gold (White Theme)</option>
        <option value="emerald_luxury">💎 Emerald Green & Gold (Dark Luxury)</option>
        <option value="classic_gold">✨ Pure White & Royal Gold</option>
        <option value="midnight_blue">🌌 Midnight Navy & Silver Blue</option>
        <option value="rose_elegance">🌸 Rose Gold & Velvet Noir</option>
      </select>
    </div>

    <div class="form-group">
      <label>Custom Color Palette</label>
      <div class="color-pickers">
        <div class="color-field">
          <input type="color" id="primaryCol" value="#4a6342" />
          <span style="font-size: 12px;">Primary / Accent</span>
        </div>
        <div class="color-field">
          <input type="color" id="bgCol" value="#f8faf7" />
          <span style="font-size: 12px;">Page Background</span>
        </div>
      </div>
    </div>

    <button class="btn-generate" onclick="generateQR()">⚡ Generate Live Album & QR</button>

    <div class="result-section" id="resultBox">
      <div class="qr-wrapper" id="qrcode"></div>
      <div class="link-box" id="albumLink"></div>
      <div class="action-links">
        <a href="#" id="openBtn" target="_blank" class="btn-action primary">🚀 Open Album</a>
        <button onclick="copyLink()" class="btn-action">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    const presets = {
      olive_gold: { primary: "#4a6342", bg: "#f8faf7" },
      emerald_luxury: { primary: "#10b981", bg: "#06281e" },
      classic_gold: { primary: "#c2a649", bg: "#ffffff" },
      midnight_blue: { primary: "#38bdf8", bg: "#0b1329" },
      rose_elegance: { primary: "#e07a5f", bg: "#1f1d24" }
    };

    function applyPreset() {
      const val = document.getElementById('presetSelect').value;
      if (val !== 'custom' && presets[val]) {
        document.getElementById('primaryCol').value = presets[val].primary;
        document.getElementById('bgCol').value = presets[val].bg;
      }
    }

    function generateQR() {
      const name = document.getElementById('evName').value.trim() || 'Wedding';
      const pCol = document.getElementById('primaryCol').value.replace('#', '');
      const bCol = document.getElementById('bgCol').value.replace('#', '');
      const rawTag = name.replace(/\s+/g, '_');

      // رابط الـ GitHub Pages الأساسي بتاعك
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      const fullUrl = `${baseUrl}/index.html?event=${encodeURIComponent(rawTag)}&p=${pCol}&bg=${bCol}`;

      document.getElementById('albumLink').innerText = fullUrl;
      document.getElementById('openBtn').href = fullUrl;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: fullUrl,
        width: 180,
        height: 180,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const text = document.getElementById('albumLink').innerText;
      navigator.clipboard.writeText(text);
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
